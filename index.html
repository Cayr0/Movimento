      parc.atualizar('juros');
      dispara(px('parc1'), ed.primeiraParcela);
      if (parc.ler().vp !== ed.valorParcelaCentavos) dispara(px('vparc'), centavosParaCampo(ed.valorParcelaCentavos));
    } else {
      f.prazoDias.value = ed.prazoDias;
      outra = !PRAZOS.includes(Number(ed.prazoDias));
      f.jurosPct.value = ed.jurosPct;
      if (ed.jurosEditadoManualmente) { f.jurosValor.value = centavosParaCampo(ed.jurosCentavos); jurosManual = ed.jurosCentavos; }
      f.multaDia.value = centavosParaCampo(ed.multaDiaCentavos || 0);
      f.renovar.checked = ed.renovarJuros ?? true;
      atualizar();
    }
    $('#f-salvar').textContent = 'Salvar alterações';
  }

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const erro = $('#f-erro');
    const nome = f.nome.value.trim().replace(/\s+/g, ' ');
    const r = ler();
    const q = parc.ler();
    const multaDiaCentavos = lerReais(f.multaDia.value);
    const problemas = [];
    if (!nome) problemas.push('Informe o nome de quem recebeu.');
    if (!r.valorCentavos) problemas.push('Informe o valor emprestado (maior que zero).');
    if (!f.dataEmprestimo.value) problemas.push('Informe a data do empréstimo.');
    if (f.dataEmprestimo.value > hojeISO()) problemas.push('A data do empréstimo não pode ser no futuro.');
    if (tipo === 'parcelado') { const pp = validarParcelas(q, f.dataEmprestimo.value); if (pp.length) parc.abrirAcc && pp.some(t => t.includes('atraso')) && parc.abrirAcc(); problemas.push(...pp); }
    if (tipo === 'unico' && f.prazoDias.value === '') problemas.push('Informe o prazo.');
    if (tipo === 'unico' && outra && f.venc.value && f.venc.value < f.dataEmprestimo.value) problemas.push('O vencimento não pode ser antes da data do empréstimo.');
    if (tipo === 'unico' && multaDiaCentavos === null && f.multaDia.value.trim() !== '') { problemas.push('Confira o valor por dia vencido.'); f.querySelector('#acc-juros').open = true; }
    if (problemas.length) { erro.textContent = problemas.join(' '); erro.hidden = false; return; }
    erro.hidden = true;
    $('#f-salvar').disabled = true;
    try {
      const { pessoas } = projetar(await lerTodas());
      let pessoa = [...pessoas.values()].find(p => p.chave === normalizar(nome));
      const movs = [];
      if (!pessoa) {
        pessoa = { id: uuid(), nome };
        movs.push({ tipo: TIPOS.PESSOA_CRIADA, pessoaId: pessoa.id, emprestimoId: null, dados: { nome } });
      }
      const emprestimoId = ed ? ed.id : uuid();
      const tipoEvento = ed ? TIPOS.EMPRESTIMO_EDITADO : TIPOS.EMPRESTIMO_CRIADO;
      const observacoes = f.observacoes.value.trim();
      if (tipo === 'parcelado') movs.push({
        tipo: tipoEvento, pessoaId: pessoa.id, emprestimoId,
        dados: { nomePessoa: pessoa.nome, moeda: 'BRL', valorCentavos: q.valor, dataEmprestimo: f.dataEmprestimo.value, ...dadosParcelado(q), observacoes },
      });
      else movs.push({
        tipo: tipoEvento, pessoaId: pessoa.id, emprestimoId,
        dados: {
          modalidade: 'unico',
          nomePessoa: pessoa.nome, moeda: 'BRL', valorCentavos: r.valorCentavos, dataEmprestimo: f.dataEmprestimo.value,
          prazoDias: Math.floor(Number(f.prazoDias.value)), vencimento: r.vencimento,
          jurosPct: r.jurosPct, jurosCentavos: r.jurosCentavos, totalPrevistoCentavos: r.totalPrevistoCentavos,
          jurosEditadoManualmente: jurosManual !== null,
          multaDiaCentavos: multaDiaCentavos ?? 0,
          renovarJuros: f.renovar.checked,
          observacoes,
        },
      });
      await registrar(movs);
      toast(ed ? 'Alterações salvas' : 'Empréstimo salvo');
      if (ed) pilha.pop(); // volta direto para a tela de onde o detalhe foi aberto
      ir('detalhe', { emprestimoId }, { substituir: true });
    } catch (err) {
      erro.textContent = 'Não foi possível salvar. Tente de novo.'; erro.hidden = false;
      $('#f-salvar').disabled = false;
      console.error(err);
    }
  });
}

      ${x.situacao === 'renegociado' ? `<div class="banner ok">Em ${fmtData(e.renegociacao.data)} o saldo de <b>${fmtR$(x.transferidoCentavos)}</b> virou um parcelamento.</div><button class="btn ghost" data-abrir="${e.renegociacao.novoEmprestimoId}">Ver parcelamento</button>` : ''}
      ${e.origemEmprestimoId ? `<button class="btn ghost" data-abrir="${e.origemEmprestimoId}">Ver empréstimo de origem</button>` : ''}
      ${!fechado(x) ? '<button class="btn" id="b-receber">Registrar recebimento</button>' : ''}
      ${!fechado(x) && !parcelado ? '<button class="btn ghost" id="b-parcelar">Parcelar dívida</button>' : ''}
      <form class="pay-form" id="form-receber" novalidate hidden>

          <label for="p-perdao">Perdoar (R$)</label>
          <input id="p-perdao" class="money" inputmode="decimal" autocomplete="off" placeholder="0,00">

        </div>
        <div class="err" id="p-erro" role="alert" hidden></div>
        <div class="row2"><button type="button" class="btn ghost" id="p-cancelar">Cancelar</button><button type="submit" class="btn" id="p-salvar">Salvar</button></div>
      </form>
      ${!fechado(x) && !parcelado ? `<form class="pay-form" id="form-parcelar" novalidate hidden>
        <h2>Parcelar dívida</h2>

        ${htmlParcelas('rp', pad)}
        <dl class="calc"><div><dt>Total</dt><dd id="rp-total" class="hl">—</dd></div><div><dt>Última parcela</dt><dd id="rp-ultima">—</dd></div>
          <div style="grid-column:1/-1"><dt>Juros</dt><dd id="rp-juros-info" style="font-size:1.05rem">—</dd></div></dl>
        <div class="err" id="rp-erro" role="alert" hidden></div>
        <div class="row2"><button type="button" class="btn ghost" id="rp-cancelar">Cancelar</button><button type="submit" class="btn" id="rp-salvar">Parcelar</button></div>
      </form>` : ''}
    </div>
    ${listaParcelas}
    <div class="card">
      <h2>Detalhes</h2>
      <dl class="kv">
        <dt>${e.origemEmprestimoId ? 'Dívida parcelada' : 'Valor emprestado'}</dt><dd>${fmtR$(e.valorCentavos)}</dd>
        ${parcelado ? `
        <dt>Parcelas</dt><dd>${e.numeroParcelas}× de ${fmtR$(e.valorParcelaCentavos)}</dd>
        <dt>1ª e última</dt><dd>${fmtData(e.primeiraParcela)} a ${fmtData(e.vencimento)}</dd>

        <dt>Atraso (${fmtR$(e.multaDiaCentavos)}/dia por parcela)</dt><dd>${fmtR$(x.multaTotal)}</dd>` : `
        <dt>Prazo</dt><dd>${plural(e.prazoDias, 'dia', 'dias')}</dd>
        <dt>Vencimento</dt><dd>${fmtData(e.vencimento)}</dd>
        ${x.renovacoes ? `<dt>Próximo vencimento</dt><dd>${fmtData(x.proximoVencimento)}</dd>` : ''}
        <dt>Juros (${fmtPct(e.jurosPct)}%)</dt><dd>${fmtR$(e.jurosCentavos)}</dd>
        ${x.renovacoes ? `<dt>Juros renovados (${x.renovacoes}×)</dt><dd>${fmtR$(x.jurosTotal - e.jurosCentavos)}</dd>` : ''}
        <dt>Atraso (${fmtR$(e.multaDiaCentavos)}/dia)</dt><dd>${fmtR$(x.multaTotal)}</dd>`}
        <dt>Total devido</dt><dd>${fmtR$(x.devidoTotal)}</dd>
        <dt>Recebido</dt><dd>${fmtR$(x.recebido)}</dd>
        ${x.perdoado ? `<dt>Perdoado</dt><dd>${fmtR$(x.perdoado)}</dd>` : ''}
        <dt><b>Falta receber</b></dt><dd><b>${fmtR$(x.saldoCentavos)}</b></dd>
        ${parcelado ? '' : `<dt>Renovar juros</dt><dd>${renovar ? 'Sim' : 'Não'}</dd>`}

      <h2>Histórico</h2>
      <ul class="log">${historico.map(h => h.html).join('')}</ul>
    </div>

      ? 'Para corrigir este empréstimo, exclua antes o parcelamento que saiu dele.'

  $('#b-excluir')?.addEventListener('click', async () => {
    const ok = await confirmar({ titulo: 'Excluir este empréstimo?', texto: `${nome} · ${fmtR$(e.valorCentavos)} em ${fmtData(e.dataEmprestimo)}. Ele e os recebimentos dele saem de todas as contas.${e.origemEmprestimoId ? ' A dívida original volta a ficar em aberto.' : ''}`, botao: 'Excluir' });
    if (!ok || !(await autenticar())) return;
    await registrar([{ tipo: TIPOS.EMPRESTIMO_EXCLUIDO, pessoaId: e.pessoaId, emprestimoId: e.id, dados: { motivo: 'excluido pelo usuário' } }]);
    toast('Empréstimo excluído');

  });
  document.querySelectorAll('[data-excluir-rec]').forEach(b => b.addEventListener('click', async () => {
    const r = e.recebimentos.find(r => r.id === b.dataset.excluirRec);
    if (!r) return;
    const desc = [r.valorCentavos ? `recebido ${fmtR$(r.valorCentavos)}` : '', r.perdaoCentavos ? `perdoado ${fmtR$(r.perdaoCentavos)}` : ''].filter(Boolean).join(' e ');
    const ok = await confirmar({ titulo: 'Excluir este recebimento?', texto: `${fmtData(r.data)}: ${desc}. O saldo é recalculado sem ele.`, botao: 'Excluir' });
    if (!ok || !(await autenticar())) return;
    await registrar([{ tipo: TIPOS.RECEBIMENTO_EXCLUIDO, pessoaId: e.pessoaId, emprestimoId: e.id, dados: { recebimentoId: r.id } }]);

    ir('detalhe', { emprestimoId: e.id }, { substituir: true });
  }));

  const f = $('#form-receber');
  const abrir = $('#b-receber');
  if (abrir) abrir.onclick = () => { f.hidden = false; abrir.hidden = true; $('#p-valor').focus(); };
  $('#p-cancelar').onclick = () => { f.hidden = true; if (abrir) abrir.hidden = false; $('#p-erro').hidden = true; };

      $('#rp-ultima').textContent = fmtData(q.ultima);

    });
    bp.onclick = () => { fp.hidden = false; bp.hidden = true; if (abrir) abrir.hidden = true; f.hidden = true; rp.atualizar(); fp.querySelector('#rp-nparc').focus(); };
    $('#rp-cancelar').onclick = () => { fp.hidden = true; bp.hidden = false; if (abrir) abrir.hidden = false; };
    fp.addEventListener('submit', async ev => {
      ev.preventDefault();
      const q = rp.ler(); const erro = $('#rp-erro');
      const problemas = validarParcelas(q, hoje);
      if (problemas.length) { erro.textContent = problemas.join(' '); erro.hidden = false; return; }
      $('#rp-salvar').disabled = true;
      try {
        const novoId = uuid();
        await registrar([
          { tipo: TIPOS.DIVIDA_PARCELADA, pessoaId: e.pessoaId, emprestimoId: e.id,
            dados: { data: hoje, saldoCentavos: x.saldoCentavos, novoEmprestimoId: novoId, numeroParcelas: q.n, valorParcelaCentavos: q.vp } },
          { tipo: TIPOS.EMPRESTIMO_CRIADO, pessoaId: e.pessoaId, emprestimoId: novoId,
            dados: { nomePessoa: e.nomePessoa, moeda: 'BRL', valorCentavos: x.saldoCentavos, dataEmprestimo: hoje, origemEmprestimoId: e.id, ...dadosParcelado(q), observacoes: '' } },
        ]);
        toast(`Dívida parcelada em ${q.n}× de ${fmtR$(q.vp)}`);
        ir('detalhe', { emprestimoId: novoId }, { substituir: true });
      } catch (err) {
        erro.textContent = 'Não foi possível salvar. Tente de novo.'; erro.hidden = false;
        $('#rp-salvar').disabled = false; console.error(err);
      }
    });
  }
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const erro = $('#p-erro');
    const vTxt = $('#p-valor').value, pTxt = $('#p-perdao').value;
    const valor = lerReais(vTxt) ?? 0, perdao = lerReais(pTxt) ?? 0;
    const data = $('#p-data').value;
    const problemas = [];
    if ((vTxt.trim() && lerReais(vTxt) === null) || (pTxt.trim() && lerReais(pTxt) === null)) problemas.push('Confira os valores digitados.');
    else if (!valor && !perdao) problemas.push('Informe o valor recebido ou o valor a perdoar.');
    if (!data) problemas.push('Informe a data.');
    else if (data < e.dataEmprestimo) problemas.push('A data não pode ser antes do empréstimo.');
    else if (data > hojeISO()) problemas.push('A data não pode ser no futuro.');
    if (!problemas.length) {
      // Saldo naquela data, considerando os lançamentos já feitos até ela
      const naData = extrato({ ...e, recebimentos: e.recebimentos.filter(r => r.data <= data) }, data, renovarPadrao);
      if (valor + perdao > naData.saldoCentavos) problemas.push(`Em ${fmtData(data)} o saldo era ${fmtR$(naData.saldoCentavos)}. Recebido mais perdoado não pode passar disso.`);
    }
    if (problemas.length) { erro.textContent = problemas.join(' '); erro.hidden = false; return; }
    $('#p-salvar').disabled = true;
    try {
      await registrar([{ tipo: TIPOS.RECEBIMENTO, pessoaId: e.pessoaId, emprestimoId: e.id, dados: { valorCentavos: valor, perdaoCentavos: perdao, data } }]);
      toast([valor ? `Recebido ${fmtR$(valor)}` : '', perdao ? `perdoado ${fmtR$(perdao)}` : ''].filter(Boolean).join(', '));
      ir('detalhe', { emprestimoId: e.id }, { substituir: true });
    } catch (err) {
      erro.textContent = 'Não foi possível salvar. Tente de novo.'; erro.hidden = false;
      $('#p-salvar').disabled = false; console.error(err);
    }
  });
}

        <label for="a-multa">Valor por dia vencido (R$)</label>
        <input id="a-multa" class="money" inputmode="decimal" autocomplete="off" value="${centavosParaCampo(pad.multaDiaCentavos)}">
        <div class="hint">Usado nos próximos empréstimos. Os já registrados mantêm o valor com que foram feitos.</div>
      </div>
      <label class="toggle" for="a-renovar"><input type="checkbox" id="a-renovar" ${pad.renovarJuros ? 'checked' : ''}>
        <span>Renovar juros se vencer sem quitar<br><span class="hint">A cada novo prazo sem pagamento total, entram os juros de novo sobre o que falta. Vale para os próximos empréstimos.</span></span></label>
      <button class="btn" type="submit">Salvar padrões</button>
    </form>
    <div class="card" id="cfg-seg">
      <h2>Segurança</h2>
      ${seg ? `<div class="sub">O app pede o PIN ao abrir e quando volta depois de 1 minuto fora.</div>
        <label class="toggle" for="s-digital"><input type="checkbox" id="s-digital" ${seg.digitalId ? 'checked' : ''} ${bioOk ? '' : 'disabled'}>
          <span>Desbloquear com a digital<br><span class="hint">${bioOk ? 'Usa a digital ou o rosto cadastrado no celular. O PIN continua valendo.' : 'Este aparelho ou navegador não oferece digital aqui. Funciona no app instalado.'}</span></span></label>
        <div class="row2"><button type="button" class="btn ghost" id="s-trocar">Trocar PIN</button><button type="button" class="btn ghost" id="s-remover">Remover PIN</button></div>`
      : `<div class="sub">Proteja o app com um PIN de 4 a 6 números. Depois você pode liberar a digital.</div>
        <button type="button" class="btn" id="s-criar">Criar PIN</button>`}
    </div>
    <div class="card" id="cfg-inicio">
      <h2>Tela inicial</h2>
      <div class="sub">Escolha o que aparece no Início.</div>
      ${[['hoje', 'A receber hoje e atrasos'], ['emprestado', 'Total emprestado'], ['operacoes', 'Operações nos últimos 30 dias'], ['receber', 'A receber no mês'], ['ultimos', 'Últimos empréstimos']].map(([k, r]) =>
        `<label class="toggle" for="ci-${k}"><input type="checkbox" id="ci-${k}" data-ci="${k}" ${ci[k] ? 'checked' : ''}><span>${r}</span></label>`).join('')}
      <div class="field"><span class="label" id="l-qtd"><b>Quantos últimos empréstimos mostrar</b></span>
        <div class="chips" role="group" aria-labelledby="l-qtd">${[3, 5, 10].map(n => `<button type="button" class="chip" data-qtd="${n}" aria-pressed="${ci.qtdUltimos === n}">${n}</button>`).join('')}</div></div>
    </div>
    <div class="card">
      <h2>Backup</h2>
      <p class="sub" style="margin:0">${fmtNum(movs.length)} movimentações guardadas neste celular. Também dá para guardar uma cópia manual em arquivo.</p>
      <div class="stack">
        <button class="btn ghost" id="b-baixar" ${window.__PWA__ ? '' : 'hidden'}>Baixar arquivo de backup</button>
        <button class="btn ghost" id="b-copiar">Copiar backup</button>
      </div>
      <pre class="backup" id="b-texto" hidden></pre>
      <div class="discreto"><button type="button" class="mini" id="b-restaurar">Restaurar de um arquivo de backup</button>
        · <button type="button" class="mini" id="b-colar">colar backup copiado</button>
        <input type="file" id="b-arquivo" accept=".json,application/json" hidden></div>
      <div class="stack" id="b-colar-box" hidden>
        <textarea id="b-colar-txt" rows="4" placeholder="Cole aqui o texto do backup" aria-label="Texto do backup"></textarea>
        <button type="button" class="btn ghost" id="b-colar-ok">Restaurar</button>
      </div>
    </div>`;
  $('#form-ajustes').addEventListener('submit', async e => {
    e.preventDefault();
    const j = Number($('#a-juros').value), p = Math.floor(Number($('#a-prazo').value));
    const m = lerReais($('#a-multa').value);
    if ($('#a-juros').value === '' || isNaN(j) || j < 0 || $('#a-prazo').value === '' || isNaN(p) || p < 0 || m === null) return toast('Use números iguais ou maiores que zero');
    await metaSet('jurosPadrao', j); await metaSet('prazoPadrao', p); await metaSet('multaDiaPadraoCentavos', m);
    await metaSet('renovarJuros', $('#a-renovar').checked);
    toast('Padrões salvos');
  });
  const recarregar = () => ir('ajustes', {}, { substituir: true });
  $('#g-entrar')?.addEventListener('click', async () => { if (await entrarComGoogle()) recarregar(); });
  $('#g-agora')?.addEventListener('click', async ev => {
    ev.target.disabled = true; $('#g-estado').textContent = 'Fazendo backup…';
    const r = await sincronizarDrive();
    toast(r.ok ? (r.importadas ? `Backup feito. ${plural(r.importadas, 'lançamento novo veio', 'lançamentos novos vieram')} do Drive.` : 'Backup feito') : 'Não foi possível fazer o backup agora');
    recarregar();
  });
  $('#g-sair')?.addEventListener('click', async () => {
    if (!(await confirmar({ titulo: 'Trocar de conta?', texto: 'Os empréstimos desta conta continuam guardados neste celular e no Drive dela. Para voltar, é só entrar de novo com este e-mail.', botao: 'Trocar' }))) return;
    trocarDeConta();
  });
  $('#s-criar')?.addEventListener('click', async () => { if (await criarPin()) { toast('PIN criado'); recarregar(); } });
  $('#s-trocar')?.addEventListener('click', async () => {
    if (!(await confirmarPinAtual('Trocar PIN'))) return;
    if (await criarPin()) { toast('PIN trocado'); recarregar(); }
  });
  $('#s-remover')?.addEventListener('click', async () => {
    if (!(await confirmarPinAtual('Remover PIN'))) return;
    await metaSet('seguranca', null); toast('PIN removido'); recarregar();
  });
  $('#s-digital')?.addEventListener('change', async ev => {
    const s = await seguranca();
    if (ev.target.checked) {
      try { s.digitalId = await registrarDigital(); await metaSet('seguranca', s); toast('Digital ativada'); }
      catch (_) { ev.target.checked = false; toast('Não foi possível ativar a digital'); }
    } else { s.digitalId = null; await metaSet('seguranca', s); toast('Digital desativada'); }
  });
  const salvarInicio = async () => { await metaSet('telaInicial', { ...ci }); toast('Tela inicial atualizada'); };
  $('#cfg-inicio').addEventListener('change', ev => { const k = ev.target.dataset.ci; if (k) { ci[k] = ev.target.checked; salvarInicio(); } });
  $('#cfg-inicio').addEventListener('click', ev => {
    const c = ev.target.closest('[data-qtd]'); if (!c) return;
    ci.qtdUltimos = Number(c.dataset.qtd);
    document.querySelectorAll('[data-qtd]').forEach(b => b.setAttribute('aria-pressed', String(b === c)));
    salvarInicio();
  });
  const conteudo = () => JSON.stringify({ app: 'controle-emprestimos', exportadoEm: new Date().toISOString(), movimentacoes: movs }, null, 1);
  $('#b-baixar').onclick = () => {
    const url = URL.createObjectURL(new Blob([conteudo()], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `backup-emprestimos-${hojeISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  };
  $('#b-restaurar').onclick = () => $('#b-arquivo').click();
  const restaurar = async texto => {
    try {
      const j = JSON.parse(texto);
      if (j?.app !== 'controle-emprestimos' || !Array.isArray(j.movimentacoes)) throw new Error('formato');
      const n = await importarMovimentacoes(j.movimentacoes);
      await marcarPendentes(j.movimentacoes);
      toast(n ? `${plural(n, 'lançamento restaurado', 'lançamentos restaurados')}` : 'Nada novo: tudo deste arquivo já estava aqui');
      if (n) { agendarBackup(); recarregar(); }
    } catch (_) { toast('Isto não é um backup do app'); }
  };
  $('#b-arquivo').onchange = async ev => { const f = ev.target.files?.[0]; if (f) await restaurar(await f.text()); ev.target.value = ''; };
  $('#b-colar').onclick = () => { $('#b-colar-box').hidden = false; $('#b-colar-txt').focus(); };
  $('#b-colar-ok').onclick = () => restaurar($('#b-colar-txt').value.trim());
  $('#b-copiar').onclick = () => {
    const txt = conteudo(); const pre = $('#b-texto');
    const mostrar = () => {
      pre.textContent = txt; pre.hidden = false;
      const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      toast('Selecione e copie o texto abaixo');
    };
    if (!navigator.clipboard) return mostrar();
    navigator.clipboard.writeText(txt).then(() => toast('Backup copiado'), mostrar);
  };
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) return ir(go.dataset.go, {}, { raiz: go.closest('nav') !== null || go.dataset.go === 'inicio' });
  const h = e.target.closest('[data-hist]');
  if (h) { const k = h.dataset.hist; return ir('historico', { filtro: k === 'emprestimos' ? { tipo: 'emprestimos', periodo: 'tudo' } : k === '30dias' ? { tipo: 'tudo', periodo: '30dias' } : k === 'areceber' ? { tipo: 'areceber' } : {} }); }
  const pe = e.target.closest('[data-pessoa]'); if (pe) return ir('pessoa', { pessoaId: pe.dataset.pessoa });
  const ab = e.target.closest('[data-abrir]'); if (ab) return ir('detalhe', { emprestimoId: ab.dataset.abrir });
});

(async function iniciar() {
  const email = googleAtivo() ? await prepararConta() : null;
  try {
    db = await abrirBanco(email ? nomeBancoConta(email) : DB_NOME);
  } catch (err) {
    console.warn('IndexedDB indisponível', err);
    avisoArmazenamento = 'Este navegador não permite guardar dados. O que você registrar agora será perdido ao fechar.';
  }
  try {
    if (!(await metaGet('dispositivoId'))) await metaSet('dispositivoId', uuid());
  } catch (err) { console.warn(err); }
  try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch (_) {}
  try { if ('serviceWorker' in navigator && location.protocol !== 'file:' && window.__PWA__) navigator.serviceWorker.register('sw.js'); } catch (_) {}
  if (email) {
    const conta = await contaGoogle();
    if (conta?.email !== email) await metaSet('google', { email, conectadoEm: new Date().toISOString() });
    await migrarBancoAntigo(email);
    if (tokenGoogle) sincronizarDrive().then(r => { if (r.ok && r.importadas) { toast(`${plural(r.importadas, 'lançamento veio', 'lançamentos vieram')} do backup`); if (estado.tela === 'inicio') ir('inicio', {}, { raiz: true }); } });
  }
  await desbloquear();
  ir('inicio', {}, { raiz: true });
})();
</script>
