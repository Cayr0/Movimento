<style>
/* Layout: uma coluna estreita de app de celular, cabeçalho grafite, barra de navegação fixa embaixo. */
:root {
  --bg: #f5f4ef;          /* papel */
  --surface: #ffffff;
  --ink: #1f2328;         /* grafite */
  --muted: #5d6168;
  --line: #dcdad2;
  --accent: #f2b705;      /* amarelo de destaque */
  --accent-ink: #1f2328;
  --ok: #2f7d4f;
  --warn: #b5541c;
  --ok-bg: #e3f1e8;
  --warn-bg: #fbe7dc;
  --field: #fbfaf7;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1e2125; --ink: #ecebe6; --muted: #a2a5ab; --line: #33373d;
    --accent: #f5c32c; --accent-ink: #15171a; --ok: #6cc28f; --warn: #f0905a;
    --ok-bg: #1d3226; --warn-bg: #3a251a; --field: #191b1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1e2125; --ink: #ecebe6; --muted: #a2a5ab; --line: #33373d;
  --accent: #f5c32c; --accent-ink: #15171a; --ok: #6cc28f; --warn: #f0905a;
  --ok-bg: #1d3226; --warn-bg: #3a251a; --field: #191b1f; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(150px + env(safe-area-inset-bottom, 0px)); }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .85rem; }
.btn-back { background: none; border: 0; color: var(--ink); font: inherit; font-weight: 600; padding: 8px 0; cursor: pointer; }
main { display: grid; gap: 16px; padding-block: 16px; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: var(--r); padding: 12px 14px; font-size: .9rem; }
.banner.ok { background: var(--ok-bg); color: var(--ok); }

/* Lista */
.list { display: grid; gap: 10px; }
.loan {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%;
}
.loan:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.loan .who { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.loan .qty { white-space: nowrap; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; text-align: right; }
.loan .meta { color: var(--muted); font-size: .85rem; }
.pill { justify-self: end; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); }
.pill.vencido { background: var(--warn-bg); color: var(--warn); }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--r); display: grid; gap: 12px; justify-items: center; }

/* Formulário */
form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
label { font-weight: 600; font-size: .9rem; }
.hint { color: var(--muted); font-size: .8rem; }
input {
  font: inherit; color: var(--ink); background: var(--field); width: 100%; min-width: 0;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; font-size: 16px;
}
textarea { font: inherit; color: var(--ink); background: var(--field); width: 100%; min-width: 0; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; font-size: 16px; min-height: 84px; resize: vertical; }
textarea:focus { border-color: var(--ink); outline: none; }
input[type=number], input.money { font-variant-numeric: tabular-nums; }
input:focus { border-color: var(--ink); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: .85rem; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.calc {
  background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 16px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.calc dt { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
.calc dd { margin: 2px 0 0; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.calc dd small { font-family: var(--font-body); font-weight: 500; font-size: .8rem; opacity: .8; }
.calc dd.hl { color: var(--accent); }
.btn {
  font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 14px 18px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-size: 1rem;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.err { color: var(--warn); font-size: .85rem; }

/* Accordion de juros */
details.acc { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); }
details.acc > summary { list-style: none; cursor: pointer; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 600; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary .resumo { color: var(--muted); font-weight: 500; font-size: .85rem; text-align: right; }
details.acc > summary::after { content: "▾"; color: var(--muted); transition: transform .15s; }
details.acc[open] > summary::after { transform: rotate(180deg); }
details.acc > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: var(--r); }
details.acc .acc-body { display: grid; gap: 14px; padding: 0 14px 14px; }

/* Detalhe */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; margin: 0; }
.kv dt { color: var(--muted); font-size: .9rem; }
.kv dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.log li { font-size: .85rem; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; }
.log b { color: var(--ink); }

/* Pessoa e recebimentos */
.person { grid-template-columns: 1fr auto; }
.person .count { color: var(--muted); font-size: .85rem; }
.section-title { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 4px; }
.pill.quitado { background: var(--line); color: var(--muted); }
.saldo { display: grid; gap: 4px; }
.saldo .big { font-family: var(--font-display); font-weight: 800; font-size: 2rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ok); }
.pay-form { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.inline-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { display: flex; gap: 12px; align-items: flex-start; font-weight: 500; }
.toggle input { width: 22px; height: 22px; flex: none; margin: 2px 0 0; accent-color: var(--ink); }
.log li.pag { border-left-color: var(--ok); }
.log li.ren { border-left-color: var(--warn); }

.parcelas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.parc { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--field); border: 1px solid var(--line); }
.parc .n { font-family: var(--font-display); font-weight: 800; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.parc .info { display: grid; min-width: 0; }
.parc .info .sub { font-size: .8rem; }
.parc .val { display: grid; justify-items: end; font-weight: 700; font-variant-numeric: tabular-nums; }
.parc .tag { font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.parc.paga { opacity: .7; }
.parc.paga .tag { color: var(--ok); }
.parc.atrasada { background: var(--warn-bg); border-color: transparent; }
.parc.atrasada .tag, .parc.atrasada .n { color: var(--warn); }
.parc.parcial .tag { color: var(--ink); }

.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search:focus-within { border-color: var(--ink); }
.search span { color: var(--muted); font-size: 1.2rem; }
.search input { border: 0; background: transparent; padding: 12px 0; }
.search input:focus { outline: none; }
.kpis { display: grid; gap: 10px; }
.kpi { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; width: 100%; font: inherit; color: inherit; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.kpi.hero { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kpi .k-label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; opacity: .75; }
.kpi .k-val { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi.hoje { cursor: default; }
.kpi.hero .k-val { color: var(--accent); font-size: 2rem; }
.kpi .k-sub { font-size: .85rem; opacity: .8; }
.kpi .k-go { grid-row: 1 / span 3; grid-column: 2; font-size: 1.2rem; opacity: .6; }
.tx { list-style: none; margin: 0; padding: 0; display: grid; }
.tx li > button, .tx li > div { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 2px; cursor: pointer; }
.tx li:last-child > * { border-bottom: 0; }
.tx .t-nome { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.tx .t-val { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.tx .t-sub { color: var(--muted); font-size: .8rem; }
.tx .t-sub2 { color: var(--muted); font-size: .8rem; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tx .in { color: var(--ok); }
.tx .warn { color: var(--warn); }
.tx-head { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 0 2px; }
.tx5 li > button { grid-template-columns: 1fr auto auto; align-items: center; }
.tx5 .t-val.r { min-width: 6.5em; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
.chips.scroll .chip { flex: none; }

/* Bloqueio */
.lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
body.travado { overflow: hidden; }
.lock-box { width: 100%; max-width: 320px; display: grid; justify-items: center; gap: 12px; text-align: center; }
.lock-box.entrada .btn, .lock-box.entrada textarea { width: 100%; }
.lock-box.entrada b { overflow-wrap: anywhere; }
.lock-sub { min-height: 1.2em; }
.dots { display: flex; gap: 14px; height: 18px; align-items: center; }
.dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
.dots span.on { background: var(--ink); }
.dots.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.lock-err { min-height: 1.3em; }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px 22px; margin-top: 4px; }
.keypad button { width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; cursor: pointer; display: grid; place-items: center; }
.keypad button:active { background: var(--line); }
.keypad .k-alt { border-color: transparent; background: transparent; font-size: 1.3rem; }
.lock-actions { display: grid; gap: 8px; width: 100%; margin-top: 8px; }

/* Ações discretas e confirmação */
.discreto { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: .8rem; text-align: center; padding-block: 4px 8px; }
.mini { background: none; border: 0; padding: 4px 2px; font: inherit; font-size: .8rem; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.log .mini { margin-left: 6px; font-size: .75rem; }
.sheet { position: fixed; inset: 0; z-index: 90; background: rgb(0 0 0 / .45); display: grid; align-items: end; justify-items: center; }
.sheet-box { width: 100%; max-width: 560px; background: var(--surface); border-radius: 18px 18px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.btn.perigo { background: var(--warn); color: #fff; }

/* Navegação */
nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
nav.bottom .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; gap: 2px; }
.tab .ic { font-size: 1.1rem; line-height: 1; }
nav.bottom .tab { font-size: .72rem; padding: 6px 2px; min-width: 0; }
.fab#tab-novo { position: fixed; z-index: 11; right: max(16px, calc(50% - 264px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; padding: 0; font-size: 2rem; line-height: 1; display: grid; place-items: center; }
nav.bottom .tab .ic { display: block; }
.tab[aria-current="page"] .ic { stroke-width: 2.4; }
.btn-gear { background: none; border: 0; color: var(--muted); padding: 8px; margin-right: -8px; border-radius: 999px; cursor: pointer; display: grid; place-items: center; }
.btn-gear:hover, .btn-gear[aria-current="page"] { color: var(--ink); }
body.sem-nav nav.bottom, body.sem-nav #tab-novo { display: none; }
body.sem-nav .app { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.tx .t-sub { white-space: nowrap; }
.tab { background: none; border: 0; font: inherit; font-size: .8rem; font-weight: 600; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 6px; cursor: pointer; }
.tab[aria-current="page"] { color: var(--ink); }
.fab { white-space: nowrap; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; font: inherit; font-weight: 800; padding: 12px 20px; cursor: pointer; box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px); }
.stack { display: grid; gap: 10px; }
pre.backup { max-height: 160px; overflow: auto; font-size: .7rem; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 8px; white-space: pre-wrap; word-break: break-all; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out; } @keyframes up { from { opacity: 0; transform: translate(-50%, -8px); } } }
</style>

    <button class="tab" id="tab-emprestimos" data-go="emprestimos"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/></svg>Empréstimos</button>

<div class="sheet" id="sheet" hidden></div>


<script>
/* =========================================================================
   Banco local (IndexedDB) como LOG DE MOVIMENTAÇÕES (append-only).
   Nada é apagado nem alterado: cada ação gera uma movimentação nova.
   O estado atual (empréstimos, pessoas, saldos) é recalculado lendo o log.
   Cada movimentação tem id único (UUID) e o campo `sincronizado`,
   para que a sincronização com a nuvem envie apenas o que falta.
   Valores em dinheiro são guardados em centavos (números inteiros).
   ========================================================================= */
const DB_NOME = 'controle-emprestimos';
const DB_VERSAO = 1;
const TIPOS = {
  PESSOA_CRIADA: 'PESSOA_CRIADA',
  EMPRESTIMO_CRIADO: 'EMPRESTIMO_CRIADO',
  RECEBIMENTO: 'RECEBIMENTO',
  DIVIDA_PARCELADA: 'DIVIDA_PARCELADA',
  // Correções: nunca apagam o registro original, só gravam uma nova movimentação por cima.
  EMPRESTIMO_EDITADO: 'EMPRESTIMO_EDITADO',
  EMPRESTIMO_EXCLUIDO: 'EMPRESTIMO_EXCLUIDO',
  RECEBIMENTO_EXCLUIDO: 'RECEBIMENTO_EXCLUIDO', // empréstimo único transformado em parcelado (fecha o antigo, abre um novo)
};
const PRAZOS = [15, 30, 60, 90];
const PADROES = { jurosPct: 10, prazoDias: 30, multaDiaCentavos: 100, renovarJuros: true };

const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

let db = null;
let memoria = { movimentacoes: [], meta: {} }; // usado se o IndexedDB não estiver disponível

function abrirBanco(nome = DB_NOME) {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('sem indexedDB'));
    const req = indexedDB.open(nome, DB_VERSAO);
    req.onupgradeneeded = () => {
      const d = req.result;
      const mov = d.createObjectStore('movimentacoes', { keyPath: 'id' });
      mov.createIndex('emprestimoId', 'emprestimoId');
      mov.createIndex('pessoaId', 'pessoaId');
      mov.createIndex('sincronizado', 'sincronizado');
      mov.createIndex('registradoEm', 'registradoEm');
      d.createObjectStore('meta', { keyPath: 'chave' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function tx(store, modo, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, modo);
    let out;
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
    out = fn(t);
  });
}

async function lerTodas() {
  if (!db) return [...memoria.movimentacoes];
  return new Promise((resolve, reject) => {
    const req = db.transaction('movimentacoes').objectStore('movimentacoes').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* Grava várias movimentações numa única transação (tudo ou nada). Só usa add(): nunca sobrescreve. */
async function registrar(movs) {
  const agora = new Date().toISOString();
  const dispositivoId = await metaGet('dispositivoId');
  const completas = movs.map((m, ordem) => ({ id: uuid(), registradoEm: agora, ordem, dispositivoId, sincronizado: 0, versao: 1, ...m }));
  if (!db) { memoria.movimentacoes.push(...completas); return completas; }
  await tx('movimentacoes', 'readwrite', t => { const s = t.objectStore('movimentacoes'); completas.forEach(m => s.add(m)); });
  agendarBackup();
  return completas;
}

async function metaGet(chave) {
  if (!db) return memoria.meta[chave];
  return new Promise((resolve, reject) => {
    const req = db.transaction('meta').objectStore('meta').get(chave);
    req.onsuccess = () => resolve(req.result ? req.result.valor : undefined);
    req.onerror = () => reject(req.error);
  });
}
async function metaSet(chave, valor) {
  if (!db) { memoria.meta[chave] = valor; return; }
  await tx('meta', 'readwrite', t => t.objectStore('meta').put({ chave, valor }));
}
const INICIO_PADRAO = { hoje: true, emprestado: true, operacoes: true, receber: true, ultimos: true, qtdUltimos: 5 };
async function configInicio() { try { return { ...INICIO_PADRAO, ...((await metaGet('telaInicial')) || {}) }; } catch (_) { return { ...INICIO_PADRAO }; } }
async function padroes() {
  return {
    jurosPct: (await metaGet('jurosPadrao')) ?? PADROES.jurosPct,
    prazoDias: (await metaGet('prazoPadrao')) ?? PADROES.prazoDias,
    multaDiaCentavos: (await metaGet('multaDiaPadraoCentavos')) ?? PADROES.multaDiaCentavos,
    renovarJuros: (await metaGet('renovarJuros')) ?? PADROES.renovarJuros,
  };
}

/* ---------- Datas e dinheiro ---------- */
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const diaUTC = iso => { const [a, m, d] = iso.split('-').map(Number); return Date.UTC(a, m - 1, d); };
const somarDias = (iso, dias) => new Date(diaUTC(iso) + Number(dias) * 864e5).toISOString().slice(0, 10);
/* Soma meses mantendo o dia (31/01 + 1 mês = 28/02 ou 29/02). */
function somarMeses(iso, meses) {
  const [a, m, d] = iso.split('-').map(Number);
  const alvo = new Date(Date.UTC(a, m - 1 + meses, 1));
  const ultimo = new Date(Date.UTC(alvo.getUTCFullYear(), alvo.getUTCMonth() + 1, 0)).getUTCDate();
  alvo.setUTCDate(Math.min(d, ultimo));
  return alvo.toISOString().slice(0, 10);
}
const diasEntre = (de, ate) => Math.round((diaUTC(ate) - diaUTC(de)) / 864e5);
const fmtData = iso => { if (!iso) return '—'; const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; };
const fmtNum = n => Number(n).toLocaleString('pt-BR');
const fmtPct = n => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const fmtR$ = centavos => (centavos / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const centavosParaCampo = c => (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: false });
const plural = (n, um, varios) => `${fmtNum(n)} ${n === 1 ? um : varios}`;
/* Aceita "1.234,56", "1234,5", "1234.56" ou "50". Retorna centavos, ou null se vazio/inválido. */
function lerReais(txt) {
  let t = String(txt ?? '').trim().replace(/[R$\s]/g, '');
  if (!t) return null;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const n = Number(t);
  return isFinite(n) && n >= 0 ? Math.round(n * 100) : null;
}

/* ---------- Estado derivado do log ---------- */
const normalizar = s => s.trim().toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');

function projetar(movs) {
  const ordenadas = [...movs].sort((a, b) => a.registradoEm.localeCompare(b.registradoEm) || (a.ordem ?? 0) - (b.ordem ?? 0));
  const pessoas = new Map();
  const emprestimos = new Map();
  for (const m of ordenadas) {
    if (m.tipo === TIPOS.PESSOA_CRIADA) {
      pessoas.set(m.pessoaId, { id: m.pessoaId, nome: m.dados.nome, chave: normalizar(m.dados.nome) });
    } else if (m.tipo === TIPOS.EMPRESTIMO_CRIADO) {
      emprestimos.set(m.emprestimoId, { id: m.emprestimoId, pessoaId: m.pessoaId, ...m.dados, criadoEm: m.registradoEm, movimentacoes: [], recebimentos: [] });
    }
    const e = m.emprestimoId && emprestimos.get(m.emprestimoId);
    if (!e) continue;
    e.movimentacoes.push(m);
    if (m.tipo === TIPOS.DIVIDA_PARCELADA) e.renegociacao = { ...m.dados };
    if (m.tipo === TIPOS.EMPRESTIMO_EDITADO) {
      emprestimos.set(e.id, { id: e.id, pessoaId: m.pessoaId, origemEmprestimoId: e.origemEmprestimoId, ...m.dados,
        criadoEm: e.criadoEm, editadoEm: m.registradoEm, movimentacoes: e.movimentacoes, recebimentos: e.recebimentos, renegociacao: e.renegociacao });
    }
    if (m.tipo === TIPOS.EMPRESTIMO_EXCLUIDO) e.excluido = true;
    if (m.tipo === TIPOS.RECEBIMENTO_EXCLUIDO) e.recebimentos = e.recebimentos.filter(r => r.id !== m.dados.recebimentoId);
    if (m.tipo === TIPOS.RECEBIMENTO) e.recebimentos.push({ id: m.id, data: m.dados.data, valorCentavos: m.dados.valorCentavos || 0, perdaoCentavos: m.dados.perdaoCentavos || 0, registradoEm: m.registradoEm });
  }
  for (const e of [...emprestimos.values()]) if (e.excluido) emprestimos.delete(e.id);
  // Se o parcelamento de uma dívida foi excluído, a dívida original volta a ficar em aberto.
  for (const e of emprestimos.values()) if (e.renegociacao && !emprestimos.has(e.renegociacao.novoEmprestimoId)) delete e.renegociacao;
  return { pessoas, emprestimos };
}

/* ---------- Cálculos ---------- */
function calcular({ valorCentavos, jurosPct, jurosManualCentavos, dataEmprestimo, prazoDias }) {
  const v = Math.max(0, valorCentavos || 0);
  let juros, pct;
  if (jurosManualCentavos !== null && jurosManualCentavos !== undefined) {
    juros = Math.max(0, jurosManualCentavos);
    pct = v > 0 ? (juros / v) * 100 : 0;
  } else {
    pct = Math.max(0, Number(jurosPct) || 0);
    juros = Math.round(v * pct / 100);
  }
  const vencimento = dataEmprestimo && prazoDias !== '' ? somarDias(dataEmprestimo, Math.max(0, Math.floor(Number(prazoDias) || 0))) : '';
  return { valorCentavos: v, jurosPct: Math.round(pct * 100) / 100, jurosCentavos: juros, totalPrevistoCentavos: v + juros, vencimento };
}

/* Extrato de um empréstimo de pagamento único até a data `ate`, dia a dia:
   - depois do vencimento, enquanto houver saldo, soma o valor por dia vencido;
   - se "renovar juros" estiver ligado, no dia seguinte a cada vencimento (o original e
     os seguintes, a cada `prazo` dias) entram novos juros sobre o que falta (valor + juros, sem a diária);
   - cada recebimento (e depois o valor perdoado) abate primeiro a diária, depois os juros e por último o valor emprestado. */
function extrato(e, ate = hojeISO(), renovarPadrao = PADROES.renovarJuros) {
  if (e.modalidade === 'parcelado') return extratoParcelado(e, ate);
  const renovar = e.renovarJuros ?? renovarPadrao;
  const prazo = Math.max(0, e.prazoDias || 0);
  const pagamentos = ordenarPagamentos(e.recebimentos);
  let sP = e.valorCentavos, sJ = e.jurosCentavos, sM = 0;
  let jurosTotal = e.jurosCentavos, multaTotal = 0, recebido = 0, perdoado = 0, renovacoes = 0, quitadoEm = null, renegociado = false;
  const eventos = [];
  const abater = v => {
    const aM = Math.min(v, sM); sM -= aM; v -= aM;
    const aJ = Math.min(v, sJ); sJ -= aJ; v -= aJ;
    const aP = Math.min(v, sP); sP -= aP;
  };
  const fim = ate < e.dataEmprestimo ? e.dataEmprestimo : ate;
  let pi = 0;
  for (let d = e.dataEmprestimo; d <= fim; d = somarDias(d, 1)) {
    if (d > e.vencimento && sP + sJ + sM > 0) {
      sM += e.multaDiaCentavos || 0; multaTotal += e.multaDiaCentavos || 0;
      const aposVenc = diasEntre(e.vencimento, d) - 1;
      if (renovar && prazo > 0 && e.jurosPct > 0 && aposVenc % prazo === 0) {
        const base = sP + sJ;
        const novos = Math.round(base * e.jurosPct / 100);
        if (novos > 0) { sJ += novos; jurosTotal += novos; renovacoes++; eventos.push({ tipo: 'renovacao', data: d, valorCentavos: novos, base }); }
      }
    }
    while (pi < pagamentos.length && pagamentos[pi].data <= d) {
      const p = pagamentos[pi++];
      abater(p.valorCentavos); abater(p.perdaoCentavos);
      recebido += p.valorCentavos; perdoado += p.perdaoCentavos;
      eventos.push({ tipo: 'recebimento', ...p });
      if (sP + sJ + sM === 0 && !quitadoEm) quitadoEm = p.data;
    }
    if (quitadoEm) break;
    if (e.renegociacao && d === e.renegociacao.data) { renegociado = true; break; }
  }
  if (renegociado) {
    return {
      saldoCentavos: 0, emAtrasoCentavos: 0, transferidoCentavos: sP + sJ + sM, jurosTotal, multaTotal, recebido, perdoado, renovacoes,
      quitadoEm: e.renegociacao.data, diasVencidos: 0, proximoVencimento: e.vencimento, parcelasAtrasadas: 0,
      devidoTotal: e.valorCentavos + jurosTotal + multaTotal, situacao: 'renegociado', eventos,
    };
  }
  const saldo = sP + sJ + sM;
  const diasVencidos = saldo > 0 ? Math.max(0, diasEntre(e.vencimento, ate)) : 0;
  const proximoVencimento = renovar && prazo > 0 && diasVencidos > 0
    ? somarDias(e.vencimento, Math.ceil(diasVencidos / prazo) * prazo) : e.vencimento;
  return {
    saldoCentavos: saldo, emAtrasoCentavos: diasVencidos > 0 ? saldo : 0,
    jurosTotal, multaTotal, recebido, perdoado, renovacoes, quitadoEm, diasVencidos, proximoVencimento,
    devidoTotal: e.valorCentavos + jurosTotal + multaTotal, parcelasAtrasadas: 0,
    situacao: saldo === 0 ? 'quitado' : diasVencidos > 0 ? 'vencido' : 'ativo', eventos,
  };
}

const ordenarPagamentos = recs => [...recs].sort((a, b) => a.data.localeCompare(b.data) || a.registradoEm.localeCompare(b.registradoEm));

/* Extrato de um empréstimo parcelado: parcelas mensais a partir da 1ª.
   Cada parcela vencida e não paga soma o valor por dia (diária por parcela).
   Recebimentos e perdões quitam sempre a parcela mais antiga em aberto (primeiro a diária dela, depois o valor). */
function extratoParcelado(e, ate = hojeISO()) {
  const parcelas = Array.from({ length: e.numeroParcelas }, (_, i) => ({
    numero: i + 1, vencimento: somarMeses(e.primeiraParcela, i),
    valorCentavos: e.valorParcelaCentavos + (i === e.numeroParcelas - 1 ? e.ajusteUltimaCentavos || 0 : 0),
    multaCentavos: 0, pagoCentavos: 0, quitadaEm: null,
  }));
  const aberto = p => p.valorCentavos + p.multaCentavos - p.pagoCentavos;
  const pagamentos = ordenarPagamentos(e.recebimentos);
  let multaTotal = 0, recebido = 0, perdoado = 0, quitadoEm = null;
  const eventos = [];
  const abater = (v, d) => {
    for (const p of parcelas) {
      if (v <= 0) break;
      const a = Math.min(v, aberto(p)); if (a <= 0) continue;
      p.pagoCentavos += a; v -= a;
      if (aberto(p) === 0) p.quitadaEm = d;
    }
  };
  const fim = ate < e.dataEmprestimo ? e.dataEmprestimo : ate;
  let pi = 0;
  for (let d = e.dataEmprestimo; d <= fim; d = somarDias(d, 1)) {
    for (const p of parcelas) {
      if (p.vencimento < d && aberto(p) > 0) { p.multaCentavos += e.multaDiaCentavos || 0; multaTotal += e.multaDiaCentavos || 0; }
    }
    while (pi < pagamentos.length && pagamentos[pi].data <= d) {
      const p = pagamentos[pi++];
      abater(p.valorCentavos, p.data); abater(p.perdaoCentavos, p.data);
      recebido += p.valorCentavos; perdoado += p.perdaoCentavos;
      eventos.push({ tipo: 'recebimento', ...p });
    }
    if (parcelas.every(p => aberto(p) === 0)) { quitadoEm = d; break; }
  }
  for (const p of parcelas) {
    p.abertoCentavos = aberto(p);
    p.situacao = p.abertoCentavos === 0 ? 'paga' : p.vencimento < ate ? 'atrasada' : p.pagoCentavos > 0 ? 'parcial' : 'aberta';
    p.diasAtraso = p.situacao === 'atrasada' ? diasEntre(p.vencimento, ate) : 0;
  }
  const atrasadas = parcelas.filter(p => p.situacao === 'atrasada');
  const proxima = parcelas.find(p => p.abertoCentavos > 0);
  const saldo = parcelas.reduce((s, p) => s + p.abertoCentavos, 0);
  return {
    parcelas, saldoCentavos: saldo, emAtrasoCentavos: atrasadas.reduce((s, p) => s + p.abertoCentavos, 0),
    jurosTotal: e.jurosCentavos, multaTotal, recebido, perdoado, renovacoes: 0, quitadoEm,
    diasVencidos: atrasadas.length ? atrasadas[0].diasAtraso : 0, parcelasAtrasadas: atrasadas.length,
    pagas: parcelas.filter(p => p.situacao === 'paga').length,
    proximaParcela: proxima, proximoVencimento: proxima ? proxima.vencimento : e.vencimento,
    devidoTotal: e.totalPrevistoCentavos + multaTotal,
    situacao: saldo === 0 ? 'quitado' : atrasadas.length ? 'vencido' : 'ativo', eventos,
  };
}
const fechado = x => x.situacao === 'quitado' || x.situacao === 'renegociado';
const pillHTML = x => x.situacao === 'quitado' ? '<span class="pill quitado">Quitado</span>'
  : x.situacao === 'renegociado' ? '<span class="pill quitado">Parcelado</span>'
  : x.parcelasAtrasadas > 1 ? `<span class="pill vencido">${x.parcelasAtrasadas} parcelas atrasadas</span>`
  : x.situacao === 'vencido' ? `<span class="pill vencido">${x.parcelasAtrasadas ? 'Parcela atrasada' : 'Vencido'} · ${plural(x.diasVencidos, 'dia', 'dias')}</span>`
  : '<span class="pill">Em dia</span>';

/* ---------- Interface ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let estado = { tela: 'inicio' };
let pilha = []; // telas anteriores, para o botão Voltar
let avisoArmazenamento = '';
let renovarPadrao = PADROES.renovarJuros;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
}

function cabecalho(titulo, sub, voltar) {
  $('#title').textContent = titulo;
  $('#subtitle').textContent = sub;
  const brand = $('#brand');
  let btn = document.getElementById('btn-voltar');
  if (voltar && !btn) {
    btn = document.createElement('button');
    btn.id = 'btn-voltar'; btn.className = 'btn-back'; btn.textContent = '← Voltar';
    btn.onclick = voltarTela;
    brand.parentElement.insertBefore(btn, $('#btn-ajustes'));
  } else if (!voltar && btn) btn.remove();
  $('#btn-ajustes').hidden = !!voltar;
  document.body.classList.toggle('sem-nav', estado.tela === 'novo');
  document.querySelectorAll('[data-go]').forEach(el => el.toggleAttribute('aria-current', false));
  const atual = document.querySelector(`[data-go="${estado.tela}"]`);
  if (atual) atual.setAttribute('aria-current', 'page');
}

function voltarTela() {
  const anterior = pilha.pop();
  if (!anterior) return ir('inicio', {}, { raiz: true });
  return ir(anterior.tela, anterior, { semPilha: true });
}

/* opts.raiz: aba do menu (zera o Voltar). opts.semPilha: voltando. opts.substituir: troca a tela atual. */
async function ir(tela, extra = {}, opts = {}) {
  if (opts.raiz) pilha = [];
  else if (!opts.semPilha && !opts.substituir) pilha.push(estado);
  estado = { ...extra, tela };
  window.scrollTo(0, 0);
  try { renovarPadrao = (await metaGet('renovarJuros')) ?? PADROES.renovarJuros; } catch (_) {}
  if (tela === 'inicio') return telaHome();
  if (tela === 'emprestimos') return telaEmprestimos();
  if (tela === 'historico') return telaHistorico(extra.filtro);
  if (tela === 'novo') return telaNovo(extra.editarId);
  if (tela === 'pessoa') return telaPessoa(extra.pessoaId);
  if (tela === 'detalhe') return telaDetalhe(extra.emprestimoId);
  if (tela === 'ajustes') return telaAjustes();
}

async function dadosAtuais() {
  const { pessoas, emprestimos } = projetar(await lerTodas());
  const hoje = hojeISO();
  const lista = [...emprestimos.values()].map(e => ({ e, x: extrato(e, hoje, renovarPadrao), nome: pessoas.get(e.pessoaId)?.nome ?? e.nomePessoa }));
  return { pessoas, emprestimos, lista };
}

/* ---------- Bloqueio por PIN e digital ----------
   O PIN é guardado só como hash (PBKDF2). A digital usa a biometria do próprio celular (WebAuthn);
   o app só recebe "confirmado" ou "não confirmado", nunca a digital em si. */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const aleatorio = n => crypto.getRandomValues(new Uint8Array(n));
const pinSuportado = () => !!(window.crypto && crypto.subtle);
async function hashPin(pin, saltB64) {
  const chave = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: deB64(saltB64), iterations: 150000 }, chave, 256);
  return b64(bits);
}
async function seguranca() { try { return (await metaGet('seguranca')) || null; } catch (_) { return null; } }
async function conferirPin(pin) { const s = await seguranca(); return !!s && (await hashPin(pin, s.salt)) === s.hash; }
async function digitalDisponivel() {
  try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (_) { return false; }
}
async function registrarDigital() {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: aleatorio(32), rp: { name: 'Controle de Empréstimos' },
    user: { id: aleatorio(16), name: 'dono', displayName: 'Dono do app' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
    timeout: 60000,
  } });
  return b64(cred.rawId);
}
async function verificarDigital(credId) {
  const r = await navigator.credentials.get({ publicKey: {
    challenge: aleatorio(32), allowCredentials: [{ type: 'public-key', id: deB64(credId) }], userVerification: 'required', timeout: 60000,
  } });
  return !!r;
}

/* Teclado de PIN em tela cheia. tamanho: número fixo de dígitos (desbloqueio) ou null (criar: 4 a 6).
   validar(pin) → true/false/'texto de erro'. Resolve com o PIN aceito, ou null se cancelar. */
function teclado({ titulo, sub = '', tamanho = null, validar = () => true, cancelavel = true, digital = null, extra = null }) {
  return new Promise(resolve => {
    const el = $('#lock');
    let pin = '', ocupado = false;
    const max = tamanho || 6;
    el.innerHTML = `
      <div class="lock-box">
        <svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="#f2b705"/><text x="32" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="22" fill="#1f2328">R$</text></svg>
        <h2>${esc(titulo)}</h2>
        <div class="sub lock-sub">${esc(sub)}</div>
        <div class="dots" aria-hidden="true">${Array.from({ length: max }, () => '<span></span>').join('')}</div>
        <div class="err lock-err" role="alert"></div>
        <div class="keypad">
          ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')}
          ${digital ? `<button type="button" data-k="bio" aria-label="Usar digital" class="k-alt"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 11v3a7 7 0 0 1-1.5 4.3"/><path d="M8.5 11a3.5 3.5 0 0 1 7 0v2.5a10 10 0 0 1-.9 4.2"/><path d="M5.6 15.5A10 10 0 0 0 6 11a6 6 0 0 1 9-5.2"/><path d="M18 8.6A6 6 0 0 1 18.5 11v1.5"/><path d="M3.5 12V11a8.5 8.5 0 0 1 12.8-7.3"/></svg></button>` : '<span></span>'}
          <button type="button" data-k="0">0</button>
          <button type="button" data-k="del" aria-label="Apagar" class="k-alt">⌫</button>
        </div>
        <div class="lock-actions">
          ${tamanho ? '' : '<button type="button" class="btn" data-k="ok" disabled>Continuar</button>'}
          ${cancelavel ? '<button type="button" class="btn ghost" data-k="cancel">Cancelar</button>' : ''}
          ${extra ? `<button type="button" class="mini" data-k="extra">${esc(extra.rotulo)}</button>` : ''}
        </div>
      </div>`;
    el.hidden = false;
    document.body.classList.add('travado');
    const pintar = () => {
      el.querySelectorAll('.dots span').forEach((d, i) => { d.classList.toggle('on', i < pin.length); d.hidden = !tamanho && i >= Math.max(4, pin.length + (pin.length < 6 ? 1 : 0)); });
      const ok = el.querySelector('[data-k="ok"]'); if (ok) ok.disabled = pin.length < 4;
    };
    const fechar = v => { el.hidden = true; el.innerHTML = ''; document.body.classList.remove('travado'); document.removeEventListener('keydown', tecla); resolve(v); };
    const erro = msg => {
      el.querySelector('.lock-err').textContent = msg; pin = ''; pintar();
      const d = el.querySelector('.dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
    };
    const enviar = async () => {
      if (ocupado) return; ocupado = true;
      const r = await validar(pin);
      ocupado = false;
      if (r === true) fechar(pin); else erro(typeof r === 'string' ? r : 'PIN incorreto');
    };
    const usarDigital = async () => {
      if (!digital || ocupado) return;
      ocupado = true;
      try { if (await digital()) return fechar('digital'); } catch (_) { el.querySelector('.lock-err').textContent = 'Digital não confirmada. Use o PIN.'; }
      ocupado = false;
    };
    const usarExtra = async () => {
      if (ocupado) return; ocupado = true;
      try { if (await extra.acao()) return fechar('extra'); } catch (_) {}
      ocupado = false; el.querySelector('.lock-err').textContent = extra.falha || 'Não deu certo.';
    };
    const apertar = k => {
      if (k === 'cancel') return fechar(null);
      if (k === 'bio') return usarDigital();
      if (k === 'extra') return usarExtra();
      if (k === 'ok') return pin.length >= 4 && enviar();
      if (k === 'del') { pin = pin.slice(0, -1); return pintar(); }
      if (pin.length >= max || ocupado) return;
      pin += k; el.querySelector('.lock-err').textContent = ''; pintar();
      if (tamanho && pin.length === tamanho) enviar();
    };
    const tecla = ev => {
      if (/^[0-9]$/.test(ev.key)) apertar(ev.key);
      else if (ev.key === 'Backspace') apertar('del');
      else if (ev.key === 'Enter' && !tamanho) apertar('ok');
      else if (ev.key === 'Escape' && cancelavel) apertar('cancel');
    };
    el.onclick = ev => { const b = ev.target.closest('[data-k]'); if (b && !b.disabled) apertar(b.dataset.k); };
    document.addEventListener('keydown', tecla);
    pintar();
    if (digital) setTimeout(usarDigital, 300);
  });
}

/* Pergunta de confirmação em tela (o navegador do preview não mostra confirm()). */
function confirmar({ titulo, texto, botao = 'Confirmar' }) {
  return new Promise(resolve => {
    const el = $('#sheet');
    el.innerHTML = `<div class="sheet-box" role="alertdialog" aria-modal="true" aria-labelledby="sh-t">
      <h2 id="sh-t">${esc(titulo)}</h2><p class="sub" style="margin:0">${esc(texto)}</p>
      <div class="row2"><button type="button" class="btn ghost" data-r="0">Cancelar</button><button type="button" class="btn perigo" data-r="1">${esc(botao)}</button></div></div>`;
    el.hidden = false;
    el.onclick = ev => {
      const b = ev.target.closest('[data-r]');
      if (!b && ev.target !== el) return;
      el.hidden = true; el.innerHTML = ''; resolve(!!b && b.dataset.r === '1');
    };
    el.querySelector('[data-r="0"]').focus();
  });
}
/* Pede PIN ou digital antes de uma ação sensível. Sem PIN cadastrado, a confirmação basta. */
async function autenticar() {
  const s = await seguranca();
  if (!s) return true;
  const r = await teclado({ titulo: 'Confirme com seu PIN', sub: 'Para excluir', tamanho: s.tamanho, validar: conferirPin,
    digital: s.digitalId ? () => verificarDigital(s.digitalId) : null });
  return r !== null;
}

let travado = false, erradas = 0, esperaAte = 0;
async function desbloquear() {
  const s = await seguranca();
  if (!s || travado) return;
  travado = true;
  await teclado({
    titulo: 'Digite seu PIN', sub: 'Controle de Empréstimos', tamanho: s.tamanho, cancelavel: false,
    digital: s.digitalId ? () => verificarDigital(s.digitalId) : null,
    extra: googleAtivo() && (await contaGoogle()) ? { rotulo: 'Esqueci o PIN', acao: recuperarPinPeloGoogle, falha: 'Não foi possível confirmar pela conta Google.' } : null,
    validar: async pin => {
      if (Date.now() < esperaAte) return `Muitas tentativas. Aguarde ${Math.ceil((esperaAte - Date.now()) / 1000)} segundos.`;
      if (await conferirPin(pin)) { erradas = 0; return true; }
      erradas++;
      if (erradas >= 5) { erradas = 0; esperaAte = Date.now() + 30000; return 'Muitas tentativas. Aguarde 30 segundos.'; }
      return 'PIN incorreto';
    },
  });
  travado = false;
}
/* Volta a pedir o PIN se o app ficou mais de 1 minuto em segundo plano. */
let saiuEm = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { saiuEm = Date.now(); return; }
  if (saiuEm && Date.now() - saiuEm > 60000 && await seguranca()) desbloquear();
});

async function criarPin() {
  if (!pinSuportado()) { toast('Este navegador não permite PIN'); return false; }
  const novo = await teclado({ titulo: 'Crie um PIN', sub: 'De 4 a 6 números' });
  if (!novo) return false;
  const conf = await teclado({ titulo: 'Confirme o PIN', sub: 'Digite de novo', tamanho: novo.length, validar: p => p === novo || 'Os PINs não batem. Tente de novo.' });
  if (!conf) return false;
  const salt = b64(aleatorio(16));
  const atual = await seguranca();
  await metaSet('seguranca', { salt, hash: await hashPin(novo, salt), tamanho: novo.length, digitalId: atual?.digitalId || null });
  return true;
}
async function confirmarPinAtual(titulo) {
  const s = await seguranca();
  return !!(await teclado({ titulo, sub: 'Digite o PIN atual', tamanho: s.tamanho, validar: conferirPin }));
}

/* ---------- Conta Google e backup no Google Drive ----------
   Cada pessoa entra com a própria conta Google e o backup vai para um arquivo no Drive dela
   (escopo drive.file: o app só enxerga os arquivos que ele mesmo criou). Não há servidor.
   O arquivo guarda o log inteiro; juntar dois logs é unir pelas ids, então o mesmo arquivo
   serve para restaurar num celular novo e para usar o app em mais de um aparelho. */
const CONFIG = window.__CONFIG__ || {};
const GOOGLE_ESCOPO = 'https://www.googleapis.com/auth/drive.file openid email';
const ARQUIVO_BACKUP = 'Controle de Empréstimos - backup.json';
const DRIVE = 'https://www.googleapis.com/drive/v3/files', DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
let tokenGoogle = null, gisCarregando = null, sincronizando = null, timerBackup = null;

const googleAtivo = () => !!CONFIG.googleClientId;
async function contaGoogle() { try { return (await metaGet('google')) || null; } catch (_) { return null; } }

function carregarGIS() {
  if (window.google?.accounts?.oauth2) return Promise.resolve(window.google.accounts.oauth2);
  if (!gisCarregando) gisCarregando = new Promise((ok, falha) => {
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => ok(window.google.accounts.oauth2);
    s.onerror = () => { gisCarregando = null; s.remove(); falha(new Error('sem conexão com o Google')); };
    document.head.appendChild(s);
  });
  return gisCarregando;
}

/* Token de acesso (vale 1 hora). Se a pessoa já autorizou, o Google devolve sem perguntar de novo. */
async function tokenDoGoogle(email, { novo = false } = {}) {
  if (!novo && tokenGoogle && tokenGoogle.expira > Date.now() + 60000) return tokenGoogle.valor;
  const oauth2 = await carregarGIS();
  return new Promise((ok, falha) => {
    const cliente = oauth2.initTokenClient({
      client_id: CONFIG.googleClientId, scope: GOOGLE_ESCOPO,
      callback: r => {
        if (r.error) return falha(new Error(r.error));
        if (!oauth2.hasGrantedAllScopes(r, 'https://www.googleapis.com/auth/drive.file')) return falha(new Error('sem permissão no Drive'));
        tokenGoogle = { valor: r.access_token, expira: Date.now() + (Number(r.expires_in) || 3600) * 1000 };
        ok(r.access_token);
      },
      error_callback: e => falha(new Error(e?.type || 'cancelado')),
    });
    cliente.requestAccessToken(email ? { prompt: '', login_hint: email } : { prompt: 'select_account' });
  });
}

async function googleApi(url, opcoes = {}) {
  const r = await fetch(url, { ...opcoes, headers: { Authorization: `Bearer ${tokenGoogle?.valor}`, ...(opcoes.headers || {}) } });
  if (r.status === 401) { tokenGoogle = null; throw new Error('token expirado'); }
  if (!r.ok) throw new Error(`Google respondeu ${r.status}`);
  return r;
}

async function emailDoGoogle() { return (await (await googleApi('https://openidconnect.googleapis.com/v1/userinfo')).json()).email; }

async function arquivoNoDrive() {
  const q = encodeURIComponent("appProperties has { key='app' and value='controle-emprestimos' } and trashed = false");
  const r = await (await googleApi(`${DRIVE}?q=${q}&spaces=drive&orderBy=${encodeURIComponent('modifiedTime desc')}&fields=files(id)`)).json();
  return r.files?.[0]?.id || null;
}

/* Acrescenta no celular as movimentações que só existem no backup. Usa add(): nunca sobrescreve. */
async function importarMovimentacoes(movs) {
  const validos = new Set(Object.values(TIPOS));
  const temos = new Set((await lerTodas()).map(m => m.id));
  const novas = movs.filter(m => m && typeof m.id === 'string' && validos.has(m.tipo) && typeof m.registradoEm === 'string' && !temos.has(m.id))
    .map(m => ({ ...m, sincronizado: 1 }));
  if (!novas.length) return 0;
  if (!db) memoria.movimentacoes.push(...novas);
  else await tx('movimentacoes', 'readwrite', t => { const s = t.objectStore('movimentacoes'); novas.forEach(m => s.add(m)); });
  return novas.length;
}

/* Lançamentos vindos de um arquivo ainda não estão no Drive: voltam a ficar pendentes. */
async function marcarPendentes(movs) {
  const ids = new Set(movs.map(m => m?.id));
  if (!db) { memoria.movimentacoes.forEach(m => { if (ids.has(m.id)) m.sincronizado = 0; }); return; }
  await tx('movimentacoes', 'readwrite', t => {
    t.objectStore('movimentacoes').openCursor().onsuccess = ev => {
      const c = ev.target.result; if (!c) return;
      if (ids.has(c.value.id) && c.value.sincronizado) c.update({ ...c.value, sincronizado: 0 });
      c.continue();
    };
  });
}

async function marcarSincronizadas(ids) {
  if (!db) { memoria.movimentacoes.forEach(m => { if (ids.has(m.id)) m.sincronizado = 1; }); return; }
  await tx('movimentacoes', 'readwrite', t => {
    t.objectStore('movimentacoes').openCursor().onsuccess = ev => {
      const c = ev.target.result; if (!c) return;
      if (ids.has(c.value.id) && !c.value.sincronizado) c.update({ ...c.value, sincronizado: 1 });
      c.continue();
    };
  });
}

/* Junta o que está no Drive com o que está no celular e deixa os dois lados iguais. */
async function sincronizarDrive() {
  if (!googleAtivo()) return { ok: false, motivo: 'indisponível' };
  if (sincronizando) await sincronizando.catch(() => {});
  const conta = await contaGoogle();
  if (!conta) return { ok: false, motivo: 'sem conta' };
  sincronizando = (async () => {
    try {
      await tokenDoGoogle(conta.email);
      const id = await arquivoNoDrive();
      let remotas = [];
      if (id) { const j = await (await googleApi(`${DRIVE}/${id}?alt=media`)).json(); remotas = Array.isArray(j?.movimentacoes) ? j.movimentacoes : []; }
      const importadas = await importarMovimentacoes(remotas);
      const locais = await lerTodas();
      const noDrive = new Set(remotas.map(m => m?.id));
      const enviadas = locais.filter(m => !noDrive.has(m.id)).length;
      if (enviadas || !id) {
        const codigo = licencasLocais()[conta.email];
        const corpo = JSON.stringify({ app: 'controle-emprestimos', conta: conta.email, exportadoEm: new Date().toISOString(),
          licenca: codigo ? { email: conta.email, codigo } : undefined,
          movimentacoes: locais.map(({ sincronizado, ...m }) => m) });
        if (id) await googleApi(`${DRIVE_UPLOAD}/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: corpo });
        else {
          const b = 'limite-' + uuid();
          const meta = { name: ARQUIVO_BACKUP, mimeType: 'application/json', appProperties: { app: 'controle-emprestimos' } };
          await googleApi(`${DRIVE_UPLOAD}?uploadType=multipart`, { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` },
            body: `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${corpo}\r\n--${b}--` });
        }
      }
      await marcarSincronizadas(new Set(locais.map(m => m.id)));
      await metaSet('google', { ...conta, ultimoBackup: new Date().toISOString() });
      return { ok: true, importadas, enviadas };
    } catch (err) { console.warn('backup no Drive', err); return { ok: false, motivo: err.message }; }
  })();
  try { return await sincronizando; } finally { sincronizando = null; }
}

/* Chamado depois de cada lançamento. O toque que gerou o lançamento ainda vale para o Google, se precisar renovar o acesso. */
function agendarBackup() {
  if (!googleAtivo()) return;
  clearTimeout(timerBackup);
  timerBackup = setTimeout(() => sincronizarDrive(), 600);
}

async function entrarComGoogle() {
  if (!googleAtivo()) { toast('O login com Google funciona no app publicado'); return false; }
  try {
    await tokenDoGoogle(null, { novo: true });
    const email = await emailDoGoogle();
    const antiga = await contaGoogle();
    if (antiga && antiga.email !== email && (await lerTodas()).length && !(await confirmar({ titulo: 'Trocar de conta?',
      texto: `Os lançamentos deste celular vão ser juntados ao backup de ${email}.`, botao: 'Juntar e continuar' }))) return false;
    await metaSet('google', { email, conectadoEm: new Date().toISOString() });
    const r = await sincronizarDrive();
    toast(!r.ok ? 'Conta conectada, mas o backup falhou. Tente de novo em Ajustes.'
      : r.importadas ? `Backup recuperado: ${plural(r.importadas, 'lançamento', 'lançamentos')}` : 'Conta conectada e backup feito');
    return true;
  } catch (err) { console.warn(err); toast('Não foi possível entrar com o Google'); return false; }
}

async function sairDoGoogle() {
  try { if (tokenGoogle && window.google?.accounts?.oauth2) window.google.accounts.oauth2.revoke(tokenGoogle.valor, () => {}); } catch (_) {}
  tokenGoogle = null;
  await metaSet('google', null);
}

/* "Esqueci o PIN": confirma pela mesma conta Google e remove o PIN. */
async function recuperarPinPeloGoogle() {
  const conta = await contaGoogle();
  if (!conta) return false;
  await tokenDoGoogle(conta.email, { novo: true });
  if ((await emailDoGoogle()) !== conta.email) throw new Error('outra conta');
  await metaSet('seguranca', null);
  toast('PIN removido. Crie um novo em Ajustes.');
  return true;
}

const fmtQuando = iso => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'nunca';

/* ---------- Contas separadas e código de ativação ----------
   Cada e-mail Google tem o próprio banco neste celular ("movimento--<email>") e o próprio backup no Drive.
   Para usar o app, a conta precisa de um código de ativação: uma assinatura ECDSA do e-mail feita pelo
   dono do app com a chave privada. O app só tem a chave pública, então confere sem internet e não consegue
   gerar códigos. O código vai junto no backup do Drive, para não pedir de novo num celular novo. */
const CHAVE_LICENCA = {"kty":"EC","crv":"P-256","x":"DHNcV-aF6W63h1pfHQUdKDyPJv7IBZGi5J4XHAwWu2U","y":"3mhLnJFpDIeYsT404nv33WGsH-z_ysrE6ME6KlpGPt0"};
const LS = {
  get: k => { try { return localStorage.getItem('movimento.' + k); } catch (_) { return null; } },
  set: (k, v) => { try { localStorage.setItem('movimento.' + k, v); } catch (_) {} },
  del: k => { try { localStorage.removeItem('movimento.' + k); } catch (_) {} },
};
const nomeBancoConta = email => 'movimento--' + email;
const limparCodigo = c => String(c || '').replace(/[^A-Za-z0-9_-]/g, '');
const licencasLocais = () => { try { return JSON.parse(LS.get('licencas') || '{}'); } catch (_) { return {}; } };
function guardarLicenca(email, codigo) { LS.set('licencas', JSON.stringify({ ...licencasLocais(), [email]: limparCodigo(codigo) })); }

async function licencaValida(email, codigo) {
  try {
    const cod = limparCodigo(codigo); if (!email || cod.length < 80) return false;
    const assinatura = Uint8Array.from(atob(cod.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const chave = await crypto.subtle.importKey('jwk', CHAVE_LICENCA, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    return await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, chave, assinatura, new TextEncoder().encode('movimento:v1:' + email.trim().toLowerCase()));
  } catch (_) { return false; }
}

/* Link de ativação: ...#ativar=CODIGO. Guarda o código até a pessoa entrar com o Google. */
function capturarCodigoDaUrl() {
  const m = location.hash.match(/ativar=([A-Za-z0-9_-]+)/);
  if (!m) return;
  LS.set('codigoPendente', m[1]);
  history.replaceState(null, '', location.pathname + location.search);
}

window.addEventListener('hashchange', () => {
  capturarCodigoDaUrl();
  const campo = document.getElementById('e-codigo');
  if (campo && LS.get('codigoPendente')) { campo.value = LS.get('codigoPendente'); document.getElementById('e-ativar')?.click(); }
});

async function licencaNoDrive() {
  try {
    const id = await arquivoNoDrive(); if (!id) return null;
    return (await (await googleApi(`${DRIVE}/${id}?alt=media`)).json())?.licenca?.codigo || null;
  } catch (_) { return null; }
}

/* Tela de entrada: Google primeiro, depois o código se a conta ainda não estiver ativada. Devolve o e-mail. */
function telaEntrada() {
  return new Promise(resolve => {
    const el = $('#lock');
    let email = null;
    document.body.classList.add('travado'); el.hidden = false;
    const logo = '<svg width="52" height="52" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="#f2b705"/><text x="32" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="22" fill="#1f2328">R$</text></svg>';
    const passoLogin = (erro = '') => {
      el.innerHTML = `<div class="lock-box entrada">${logo}
        <h2>Movimento</h2>
        <div class="sub lock-sub">Controle de empréstimos. Entre com sua conta Google: cada conta tem os próprios empréstimos e o próprio backup no seu Google Drive.</div>
        <button type="button" class="btn" id="e-google">Entrar com Google</button>
        <div class="err lock-err" role="alert">${esc(erro)}</div></div>`;
      $('#e-google').onclick = entrar;
    };

async function migrarBancoAntigo(email) {
  if (LS.get('antigo')) return;
  try {
    if (indexedDB.databases && !(await indexedDB.databases()).some(d => d.name === DB_NOME)) { LS.set('antigo', 'nenhum'); return; }
    const antigo = await abrirBanco(DB_NOME);
    const ler = store => new Promise((ok, falha) => { const r = antigo.transaction(store).objectStore(store).getAll(); r.onsuccess = () => ok(r.result); r.onerror = () => falha(r.error); });
    const movs = await ler('movimentacoes'), metas = await ler('meta');
    antigo.close();
    if (!movs.length) { LS.set('antigo', 'vazio'); return; }
    const sim = await confirmar({ titulo: 'Trazer os empréstimos anteriores?',
      texto: `Este celular tem ${plural(movs.length, 'lançamento', 'lançamentos')} de antes das contas separadas. Trazer para ${email}? Se não, eles ficam guardados à parte.`, botao: 'Trazer' });
    if (!sim) { LS.set('antigo', 'recusado'); return; }
    await importarMovimentacoes(movs); await marcarPendentes(movs);
    for (const { chave, valor } of metas)
      if (['jurosPadrao', 'prazoPadrao', 'multaDiaPadraoCentavos', 'renovarJuros', 'telaInicial', 'seguranca'].includes(chave) && (await metaGet(chave)) === undefined) await metaSet(chave, valor);

}

const fimDoMes = iso => somarDias(somarMeses(iso.slice(0, 8) + '01', 1), -1);
const nomeMes = iso => new Date(diaUTC(iso)).toLocaleDateString('pt-BR', { month: 'long', timeZone: 'UTC' });

/* Todas as transações (empréstimos, recebimentos, parcelamentos), mais recentes primeiro. */
function transacoes(lista) {
  const tx = [];
  for (const { e, nome } of lista) {
    tx.push({ tipo: e.origemEmprestimoId ? 'parcelamento' : 'emprestimo', data: e.dataEmprestimo, ordem: e.criadoEm, nome, valor: e.valorCentavos, emprestimoId: e.id,
      detalhe: e.modalidade === 'parcelado' ? `${e.numeroParcelas}× de ${fmtR$(e.valorParcelaCentavos)}` : `vence ${fmtData(e.vencimento)}` });
    for (const r of e.recebimentos) tx.push({ tipo: 'recebimento', data: r.data, ordem: r.registradoEm, nome, valor: r.valorCentavos, perdao: r.perdaoCentavos, emprestimoId: e.id });
  }
  return tx.sort((a, b) => b.data.localeCompare(a.data) || b.ordem.localeCompare(a.ordem));
}

/* O que vence até o fim do mês (inclui o que já está atrasado). */
function aReceberNoMes(lista, hoje = hojeISO()) {
  const fim = fimDoMes(hoje), itens = [];
  for (const { e, x, nome } of lista) {
    if (fechado(x)) continue;
    if (e.modalidade === 'parcelado') {
      for (const p of x.parcelas) if (p.abertoCentavos > 0 && p.vencimento <= fim)
        itens.push({ nome, vencimento: p.vencimento, valor: p.abertoCentavos, atrasado: p.vencimento < hoje, emprestimoId: e.id, detalhe: `parcela ${p.numero}/${e.numeroParcelas}` });
    } else if (x.proximoVencimento <= fim) {
      const atrasado = x.situacao === 'vencido';
      itens.push({ nome, vencimento: atrasado ? e.vencimento : x.proximoVencimento, valor: x.saldoCentavos, atrasado, emprestimoId: e.id, detalhe: 'pagamento único' });
    }
  }
  return itens.sort((a, b) => a.vencimento.localeCompare(b.vencimento));
}

/* O que já deveria ter sido pago até hoje: vence hoje ou está atrasado (parcelas atrasadas somadas por empréstimo). */
function aReceberHoje(lista, hoje = hojeISO()) {
  const hojeItens = [], atrasos = new Map();
  for (const i of aReceberNoMes(lista, hoje)) {
    if (i.atrasado) {
      const a = atrasos.get(i.emprestimoId);
      if (a) { a.valor += i.valor; a.parcelas++; }
      else atrasos.set(i.emprestimoId, { ...i, parcelas: 1 });
    } else if (i.vencimento <= hoje) hojeItens.push(i);
  }
  const atrasados = [...atrasos.values()].sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  return { hojeItens, atrasados, total: [...hojeItens, ...atrasados].reduce((s, i) => s + i.valor, 0) };
}

/* CSV no formato do Excel brasileiro: ponto e vírgula, vírgula decimal, datas dd/mm/aaaa. Colunas "Valor"/"Perdoado" vêm em centavos. */
function exportarCSV(nome, linhas) {
  const cel = (v, col) => {
    if (typeof v === 'number' && /Valor|Perdoado/.test(linhas[0][col])) return (v / 100).toFixed(2).replace('.', ',');
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtData(v);
    const t = String(v ?? '');
    return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
  };
  const txt = '\ufeff' + linhas.map((l, r) => l.map((v, c) => r ? cel(v, c) : v).join(';')).join('\r\n');
  if (!window.__PWA__) {
    // Na prévia o navegador não deixa baixar arquivos: copia o conteúdo.
    navigator.clipboard?.writeText(txt).then(() => toast('CSV copiado. No app instalado ele é baixado como arquivo.'), () => toast('No app instalado o CSV é baixado como arquivo.'));
    return;
  }
  const url = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('CSV exportado');
}

    return { ...g, ativos, vencidos, aReceber: ativos.reduce((s, i) => s + i.x.saldoCentavos, 0), maiorAtraso: Math.max(0, ...vencidos.map(i => i.x.diasVencidos)) };
  });
  const comSaldo = resumo.filter(g => g.ativos.length).sort((a, b) => b.vencidos.length - a.vencidos.length || b.aReceber - a.aReceber);
  const semSaldo = resumo.filter(g => !g.ativos.length).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const totalReceber = comSaldo.reduce((s, g) => s + g.aReceber, 0);
  const card = g => {
    const pill = g.vencidos.length > 1 ? `<span class="pill vencido">${g.vencidos.length} vencidos</span>` : g.vencidos.length ? pillHTML(g.vencidos[0].x)
      : g.ativos.length ? '<span class="pill">Em dia</span>' : '<span class="pill quitado">Quitado</span>';
    const alvo = g.ativos.length === 1 && g.itens.length === 1 ? `data-abrir="${g.ativos[0].e.id}"` : `data-pessoa="${g.pessoaId}"`;
    return `<button class="loan person" ${alvo} data-busca="${esc(normalizar(g.nome))}">
      <span class="who">${esc(g.nome)}</span>
      <span class="qty">${fmtR$(g.aReceber)}</span>
      <span class="count">${g.ativos.length ? plural(g.ativos.length, 'empréstimo ativo', 'empréstimos ativos') : plural(g.itens.length, 'empréstimo quitado', 'empréstimos quitados')}</span>
      ${pill}
    </button>`;
  };
  $('#view').innerHTML = `${banner}
    <div class="saldo"><span class="section-title">Total a receber</span><span class="big">${fmtR$(totalReceber)}</span>
      <span class="sub">${plural(comSaldo.length, 'pessoa', 'pessoas')} com saldo em aberto</span></div>
    <div class="search"><span aria-hidden="true">⌕</span><input id="busca" type="search" placeholder="Buscar pessoa" autocomplete="off" aria-label="Buscar pessoa"></div>
    <div class="list" id="lista-com">${comSaldo.map(card).join('')}</div>
    ${semSaldo.length ? `<div class="section-title" id="titulo-sem">Sem saldo em aberto</div><div class="list" id="lista-sem">${semSaldo.map(card).join('')}</div>` : ''}
    <div class="empty" id="busca-vazia" hidden>Ninguém encontrado com esse nome.</div>`;
  $('#busca').addEventListener('input', ev => {
    const t = normalizar(ev.target.value);
    let visiveis = 0;
    document.querySelectorAll('[data-busca]').forEach(c => { const ok = !t || c.dataset.busca.includes(t); c.hidden = !ok; if (ok) visiveis++; });
    const sem = $('#lista-sem');
    if (sem) $('#titulo-sem').hidden = ![...sem.children].some(c => !c.hidden);
    $('#busca-vazia').hidden = visiveis > 0;
  });
}

async function telaPessoa(pessoaId) {

  const nome = pessoas.get(pessoaId)?.nome ?? itens[0]?.nome;
  if (!itens.length) return ir('inicio', {}, { raiz: true });
  cabecalho(nome, 'Empréstimos da pessoa', true);
  const ativos = itens.filter(i => !fechado(i.x)).sort((a, b) => a.e.vencimento.localeCompare(b.e.vencimento));
  const quitados = itens.filter(i => fechado(i.x)).sort((a, b) => b.x.quitadoEm.localeCompare(a.x.quitadoEm));
  const aReceber = ativos.reduce((s, i) => s + i.x.saldoCentavos, 0);

  const linha = i => `<button class="loan" data-abrir="${i.e.id}">

      <span class="qty">${fmtR$(i.x.saldoCentavos)}</span>
      <span class="meta">${i.e.modalidade === 'parcelado' ? `${i.e.numeroParcelas}× de ${fmtR$(i.e.valorParcelaCentavos)} · ${i.x.pagas}/${i.e.numeroParcelas} pagas · ` : ''}${i.x.situacao === 'renegociado' ? `parcelado em ${fmtData(i.x.quitadoEm)}` : i.x.situacao === 'quitado' ? `quitado em ${fmtData(i.x.quitadoEm)}` : `vence ${fmtData(i.x.proximoVencimento)}`} · recebido ${fmtR$(i.x.recebido)}</span>
      ${pillHTML(i.x)}
    </button>`;
  $('#view').innerHTML = `
    <div class="card">
      <div class="saldo"><span class="section-title">A receber de ${esc(nome)}</span><span class="big">${fmtR$(aReceber)}</span>
      <span class="sub">${plural(ativos.length, 'empréstimo ativo', 'empréstimos ativos')} · já recebido ${fmtR$(recebido)}</span></div>
    </div>
    <div class="section-title">Ativos</div>
    <div class="list">${ativos.length ? ativos.map(linha).join('') : '<div class="empty">Nenhum empréstimo ativo.</div>'}</div>
    ${quitados.length ? `<details class="acc"><summary><span>Quitados</span><span class="resumo">${quitados.length}</span></summary><div class="acc-body list">${quitados.map(linha).join('')}</div></details>` : ''}`;
}

/* ---------- Bloco reutilizável de parcelamento (novo empréstimo e "Parcelar dívida") ----------
   Juros simples ao mês: total = valor × (1 + juros% × parcelas). Parcela = total ÷ parcelas.
   Se a parcela for digitada à mão, os juros ao mês se ajustam. */
function htmlParcelas(px, pad) {

        </div>
        <div class="field">
          <label for="${px}-vparc">Valor da parcela (R$)</label>
          <input id="${px}-vparc" class="money" inputmode="decimal" autocomplete="off" placeholder="calculado">
        </div>
      </div>
      <div class="field">
        <label for="${px}-parc1">1ª parcela vence em</label>
        <input id="${px}-parc1" type="date">
        <div class="hint">As demais vencem todo mês no mesmo dia.</div>
      </div>
      <details class="acc" id="${px}-acc">
        <summary><span>Juros e atraso</span><span class="resumo" id="${px}-resumo"></span></summary>
        <div class="acc-body">

          </div>

              <label for="${px}-juros">Juros ao mês (%)</label>
              <input id="${px}-juros" type="number" inputmode="decimal" min="0" step="0.5" value="${pad.jurosPct}">
            </div>
            <div class="field">
              <label for="${px}-multa">Atraso por dia, por parcela (R$)</label>
              <input id="${px}-multa" class="money" inputmode="decimal" autocomplete="off" value="${centavosParaCampo(pad.multaDiaCentavos)}">
            </div>
          </div>
          <div class="hint">Os juros já vêm do padrão em Ajustes. Se você digitar o valor da parcela, os juros se ajustam.</div>
        </div>
      </details>`;
}

/* Liga os campos do bloco. getBase() devolve { valor (centavos), data (ISO) }. onChange recebe o cálculo. */
function ligarParcelas(raiz, px, getBase, onChange) {
  const el = id => raiz.querySelector(`#${px}-${id}`);
  const nparc = el('nparc'), vparc = el('vparc'), parc1 = el('parc1'), juros = el('juros'), multa = el('multa');
  let parcelaManual = null, parc1Manual = false;
  const ler = () => {
    const { valor } = getBase();
    const n = Math.floor(Number(nparc.value) || 0);
    let pct = Math.max(0, Number(juros.value) || 0), vp, total;
    if (parcelaManual !== null && n) { vp = parcelaManual; total = vp * n; pct = valor ? Math.max(0, (total / valor - 1) / n * 100) : 0; }
    else { total = n ? Math.round(valor * (1 + pct / 100 * n)) : 0; vp = n ? Math.round(total / n) : 0; }
    const ajuste = total - vp * n; // centavos de arredondamento, somados à última parcela
    return {
      valor, n, vp, total, ajuste, juros: total - valor, jurosMensalPct: Math.round(pct * 100) / 100,
      pctTotal: valor ? Math.round((total - valor) / valor * 10000) / 100 : 0,
      primeira: parcel1Valor(), ultima: n && parc1.value ? somarMeses(parc1.value, n - 1) : '',
      multaCentavos: lerReais(multa.value), multaTexto: multa.value,
    };
  };
  const parcel1Valor = () => parc1.value;
  const atualizar = (origem) => {
    if (origem === 'vparc') parcelaManual = lerReais(vparc.value);
    if (origem === 'juros' || origem === 'n') { if (origem === 'juros') parcelaManual = null; }
    const { data } = getBase();
    if (origem === 'parc1') parc1Manual = !!parc1.value;
    if (!parc1Manual && data) parc1.value = somarMeses(data, 1); // segue a data do empréstimo até ser mudada à mão
    const q = ler();
    if (parcelaManual === null) { if (origem !== 'vparc') vparc.value = q.vp ? centavosParaCampo(q.vp) : ''; }
    else juros.value = q.jurosMensalPct;
    el('resumo').textContent = `${fmtPct(q.jurosMensalPct)}% ao mês · ${fmtR$(lerReais(multa.value) ?? 0)}/dia`;
    raiz.querySelectorAll('[data-jp]').forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.jp) === Number(juros.value))));
    onChange && onChange(q);
  };
  nparc.addEventListener('input', () => atualizar('n'));
  vparc.addEventListener('input', () => atualizar('vparc'));
  juros.addEventListener('input', () => atualizar('juros'));
  parc1.addEventListener('input', () => atualizar('parc1'));
  multa.addEventListener('input', () => atualizar());
  raiz.addEventListener('click', ev => { const c = ev.target.closest('[data-jp]'); if (c && raiz.contains(c)) { juros.value = c.dataset.jp; atualizar('juros'); } });
  return { ler, atualizar, abrirAcc: () => (el('acc').open = true) };
}
function validarParcelas(q, dataBase) {
  const problemas = [];
  if (!q.n || q.n > 120) problemas.push('Informe o número de parcelas (1 a 120).');
  if (!q.vp) problemas.push('Confira o valor da parcela.');
  if (q.n && q.vp && q.total < q.valor) problemas.push('O total das parcelas não pode ser menor que o valor.');
  if (!q.primeira) problemas.push('Informe quando vence a 1ª parcela.');
  else if (dataBase && q.primeira < dataBase) problemas.push('A 1ª parcela não pode vencer antes da data do empréstimo.');
  if (q.multaCentavos === null && q.multaTexto.trim() !== '') problemas.push('Confira o valor de atraso por dia.');
  return problemas;
}
const dadosParcelado = q => ({
  modalidade: 'parcelado', numeroParcelas: q.n, valorParcelaCentavos: q.vp, ajusteUltimaCentavos: q.ajuste, primeiraParcela: q.primeira, vencimento: q.ultima,
  jurosMensalPct: q.jurosMensalPct, jurosPct: q.pctTotal, jurosCentavos: q.juros, totalPrevistoCentavos: q.total,
  multaDiaCentavos: q.multaCentavos ?? 0, renovarJuros: false,
});

    valorCentavos: lerReais(f.valor.value), jurosPct: f.jurosPct.value, jurosManualCentavos: jurosManual,

    $('#acc-resumo').textContent = `${fmtPct(r.jurosPct)}% · ${fmtR$(multa)}/dia`;

    if (outra && f.dataEmprestimo.value && r.vencimento) f.venc.value = r.vencimento;
    document.querySelectorAll('[data-prazo]').forEach(c => c.setAttribute('aria-pressed', String(!outra && c.dataset.prazo === String(f.prazoDias.value))));
    $('#chip-outra').setAttribute('aria-pressed', String(outra));
    $('#campo-outra').hidden = !outra;
    $('#sec-unico').hidden = tipo !== 'unico';

    $('#r-juros-parc').hidden = tipo !== 'parcelado';
    document.querySelectorAll('[data-tipo]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.tipo === tipo)));

      $('#r-venc').textContent = fmtData(q.ultima);
      $('#r-total').textContent = fmtR$(q.total);
      $('#r-juros-parc-v').textContent = q.n && q.vp && q.valor ? `${fmtR$(q.juros)} (${fmtPct(q.jurosMensalPct)}% ao mês) · ${q.n}× de ${fmtR$(q.vp)}` : '—';
    } else $('#r-venc-t').textContent = 'Vencimento';
  };
  parc = ligarParcelas($('#sec-parc'), 'np', () => ({ valor: lerReais(f.valor.value) ?? 0, data: f.dataEmprestimo.value }), () => atualizar('parc'));
  f.valor.addEventListener('input', () => { atualizar('valor'); if (tipo === 'parcelado') parc.atualizar(); });
  f.jurosPct.addEventListener('input', () => atualizar('juros'));
  f.jurosValor.addEventListener('input', () => atualizar('jurosValor'));
  f.multaDia.addEventListener('input', () => atualizar());
  f.dataEmprestimo.addEventListener('input', () => {
    if (outra && f.venc.value && f.dataEmprestimo.value) f.prazoDias.value = Math.max(0, diasEntre(f.dataEmprestimo.value, f.venc.value));
    atualizar();
    if (tipo === 'parcelado') parc.atualizar();
  });
  f.venc = $('#f-venc');
  f.venc.addEventListener('input', () => {
    if (!f.venc.value || !f.dataEmprestimo.value) return;
    f.prazoDias.value = Math.max(0, diasEntre(f.dataEmprestimo.value, f.venc.value)); atualizar();
  });
  f.addEventListener('click', e => {

  });
  atualizar();
  if (ed) {

    f.nome.value = pessoas.get(ed.pessoaId)?.nome ?? ed.nomePessoa;

    if (ed.observacoes) { f.observacoes.value = ed.observacoes; $('#acc-obs').open = true; }
    if (ed.modalidade === 'parcelado') {
      tipo = 'parcelado'; atualizar();
